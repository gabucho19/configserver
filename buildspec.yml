version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 137787521523.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build JAR
      - mvn clean package -DskipTests
      - echo Build Docker image
      - docker build -t configserver-repo .

  post_build:
    commands:
      - docker tag configserver-repo:latest 137787521523.dkr.ecr.us-east-1.amazonaws.com/configserver-repo:latest
      - docker push 137787521523.dkr.ecr.us-east-1.amazonaws.com/configserver-repo:latest

